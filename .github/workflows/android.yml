# Compila l'APK di WorkoutControl (cartella mobile/).
#
# L'APK contiene il frontend: il job builda prima frontend/dist e poi lo
# impacchetta con `cap sync`. L'unica cosa che l'app cerca in rete e' l'API.
#
# Gira su GitHub e non in locale perche' la macchina di sviluppo non ha
# l'Android SDK e monta una JDK piu' recente di quella che Gradle si aspetta:
# qui l'ambiente e' fissato e riproducibile, e l'APK esce come artifact da
# scaricare e installare via sideload.
#
# Nota: main NON e' fra i trigger. Un push su main fa partire il webhook che
# aggiorna la VPS, e questo workflow non c'entra con quel deploy.

name: APK Android

on:
  push:
    branches: [android-app]
    paths:
      - "frontend/**"
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      api_origin:
        description: "Server a cui l'app parla, senza /api finale (vuoto = la VPS). Deve essere https, altrimenti Android blocca il traffico in chiaro."
        required: false
        default: ""

env:
  # Da dentro l'APK i percorsi relativi punterebbero al telefono: l'API va
  # indirizzata per intero (vedi frontend/src/lib/api.ts).
  API_ORIGIN: ${{ inputs.api_origin || 'https://indirizzo-rimosso/workout' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          # La CLI di Capacitor 8 richiede Node >= 22.
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json

      - name: JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Build del frontend
        working-directory: frontend
        env:
          VITE_API_ORIGIN: ${{ env.API_ORIGIN }}
        run: |
          npm ci
          npm run build
          # L'origin viene inlineata dal bundler e "/api" si concatena a
          # runtime: si cerca quindi l'origin, non l'URL intero. Senza questo
          # controllo una variabile scritta male darebbe un APK che si installa
          # e poi non parla con niente.
          grep -q "$VITE_API_ORIGIN" dist/assets/*.js \
            || { echo "::error::VITE_API_ORIGIN non e' finita nel bundle"; exit 1; }
          echo "L'app parlera' con $VITE_API_ORIGIN"

      - name: Dipendenze del guscio
        working-directory: mobile
        run: npm ci

      # Copia frontend/dist dentro il progetto Android e rigenera i file che
      # .gitignore tiene fuori dal repo perche' derivati (config e plugin).
      - name: Sync Capacitor
        working-directory: mobile
        run: |
          npx cap sync android
          test -f android/app/src/main/assets/public/index.html \
            || { echo "::error::il frontend non e' finito nell'APK"; exit 1; }

      # Il repo si aggiorna da Windows, che non versiona il bit di esecuzione.
      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Pubblica l'APK
        uses: actions/upload-artifact@v7
        with:
          name: workoutcontrol-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
