# Compila l'APK di WorkoutControl e pubblica l'aggiornamento per i dispositivi.
#
# L'APK impacchetta il frontend, quindi senza questo ogni modifica alla UI
# vorrebbe dire reinstallare l'app a mano. Il job produce due cose:
#
#   web-bundle.zip  il solo frontend. L'app lo scarica e lo applica al riavvio
#                   successivo, in silenzio: copre tutte le modifiche normali.
#   app-release.apk serve solo quando cambia la parte nativa (un plugin nuovo,
#                   il manifest). Android non lascia installarlo senza un tap,
#                   quindi l'app si limita a segnalarlo in Impostazioni.
#
# manifest.json lega le due cose e vive a un URL stabile:
#   .../releases/latest/download/manifest.json
#
# Da main esce una release vera, che diventa "latest" e raggiunge i telefoni.
# Da android-app esce una prerelease, che "latest" ignora: si prova senza
# spingere niente sui dispositivi.
#
# Il push su main fa partire anche il webhook che aggiorna la VPS: un solo
# gesto allinea webapp e app.

name: APK Android

on:
  push:
    branches: [main, android-app]
    paths:
      - "frontend/**"
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      api_origin:
        description: "Server a cui l'app parla, senza /api finale (vuoto = la VPS). Deve essere https, altrimenti Android blocca il traffico in chiaro."
        required: false
        default: ""

permissions:
  contents: write

env:
  # Da dentro l'APK i percorsi relativi punterebbero al telefono: l'API va
  # indirizzata per intero (vedi frontend/src/lib/api.ts).
  #
  # L'indirizzo non sta scritto qui perche' il repo e' pubblico: vive nel
  # secret API_ORIGIN. Deve essere un secret e non una variable: su un repo
  # pubblico i log delle Actions li legge chiunque, e l'env viene stampato a
  # ogni step — da variable l'indirizzo comparirebbe in chiaro una ventina di
  # volte per build. Da secret esce come ***. L'input api_origin lo scavalca
  # per una singola build, ma quello che ci scrivi finisce nei log.
  API_ORIGIN: ${{ inputs.api_origin || secrets.API_ORIGIN }}
  # Deve crescere a ogni pubblicazione: e' cosi' che l'app riconosce un bundle
  # nuovo, ed e' quello che Android pretende per installare un APK sopra un
  # altro. run_number cresce da solo e non torna mai indietro.
  VERSIONE: 1.0.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Senza indirizzo la build finirebbe comunque, sfornando un APK che si
      # installa e non parla con niente: meglio fermarsi al primo secondo che
      # accorgersene dal telefono.
      - name: Controlla l'indirizzo del server
        run: |
          [ -n "$API_ORIGIN" ] || {
            echo "::error::manca il secret API_ORIGIN (Settings > Secrets and variables > Actions > Secrets)"
            exit 1
          }

      - uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          # La CLI di Capacitor 8 richiede Node >= 22.
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json

      - name: JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Build del frontend
        working-directory: frontend
        env:
          VITE_API_ORIGIN: ${{ env.API_ORIGIN }}
        run: |
          npm ci
          npm run build
          # L'origin viene inlineata dal bundler e "/api" si concatena a
          # runtime: si cerca quindi l'origin, non l'URL intero. Senza questo
          # controllo una variabile scritta male darebbe un APK che si installa
          # e poi non parla con niente.
          grep -q "$VITE_API_ORIGIN" dist/assets/*.js \
            || { echo "::error::VITE_API_ORIGIN non e' finita nel bundle"; exit 1; }
          # Non lo si stampa: e' un secret, uscirebbe come *** e basta. Che
          # sia quello giusto lo dice il grep qui sopra.
          echo "Origin API inlineata nel bundle"

      # Lo zip che l'app scarica per aggiornarsi: il contenuto di dist, con
      # index.html in radice, che e' come il plugin si aspetta di trovarlo.
      - name: Prepara il bundle web
        working-directory: frontend/dist
        run: zip -r -q "$GITHUB_WORKSPACE/web-bundle.zip" .

      - name: Dipendenze del guscio
        working-directory: mobile
        run: npm ci

      # Copia frontend/dist dentro il progetto Android e rigenera i file che
      # .gitignore tiene fuori dal repo perche' derivati (config e plugin).
      - name: Sync Capacitor
        working-directory: mobile
        run: |
          npx cap sync android
          test -f android/app/src/main/assets/public/index.html \
            || { echo "::error::il frontend non e' finito nell'APK"; exit 1; }

      # Senza una firma stabile ogni build sarebbe un'app diversa per Android e
      # l'aggiornamento verrebbe rifiutato per firma non corrispondente: le
      # build di debug usano una chiave generata al volo, diversa a ogni runner.
      - name: Ricostruisci il keystore
        run: |
          # `tr -d` toglie a capo e spazi: un secret caricato da Windows puo'
          # portarsi dietro CR o un BOM, e base64 -d fallirebbe senza dire
          # perche'. Il controllo sotto verifica che ne sia uscito un keystore
          # vero, invece di lasciare che sia Gradle a fallire piu' avanti.
          echo "${{ secrets.ANDROID_KEYSTORE }}" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASS }}" > /dev/null \
            || { echo "::error::keystore o password non validi (controlla i secret ANDROID_*)"; exit 1; }

      # Il repo si aggiorna da Windows, che non versiona il bit di esecuzione.
      - name: Build APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=$VERSIONE
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/app-release.apk"

      # Se la firma cambiasse, gli APK gia' installati non si aggiornerebbero
      # piu' e ce ne accorgeremmo solo dal telefono, con un "app non
      # installata" senza spiegazioni. L'impronta attesa e' quella del keystore
      # generato una volta sola: qui si controlla che sia ancora quella.
      - name: Verifica la firma
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app-release.apk | tee firma.txt
          # apksigner stampa l'impronta senza due punti e in minuscolo, keytool
          # con i due punti: si normalizza prima di confrontare.
          tr -d ':' < firma.txt | tr 'A-Z' 'a-z' \
            | grep -q "6023e853e38bff6a14bba344a545f49310c72ce6478858d5611450e11d057260" \
            || { echo "::error::l'APK non e' firmato con il keystore atteso: gli aggiornamenti verrebbero rifiutati"; exit 1; }

      - name: Scrivi il manifest
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/v$VERSIONE"
          cat > manifest.json <<JSON
          {
            "versione": "$VERSIONE",
            "bundle_url": "$base/web-bundle.zip",
            "apk_version_code": ${{ github.run_number }},
            "apk_url": "$base/app-release.apk"
          }
          JSON
          cat manifest.json

      # Da main la release e' definitiva e diventa "latest", quella che i
      # dispositivi interrogano. Dagli altri branch resta prerelease, quindi
      # scaricabile a mano ma invisibile a "latest".
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then FLAG=""; else FLAG="--prerelease"; fi
          gh release create "v$VERSIONE" \
            web-bundle.zip app-release.apk manifest.json \
            --title "v$VERSIONE" \
            --notes "Build automatica da ${{ github.ref_name }} (${{ github.sha }})." \
            --target "${{ github.sha }}" \
            $FLAG

      # Comodo per scaricare l'APK dalla run senza passare dalle release.
      - name: Allega l'APK alla run
        uses: actions/upload-artifact@v7
        with:
          name: workoutcontrol-apk
          path: app-release.apk
          if-no-files-found: error
