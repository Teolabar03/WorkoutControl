name: Verifiche
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Prima installazione da zero
        env:
          WORKOUT_PASSWORD: ci-temporary-password
          PYTHONUTF8: '1'
        run: python install.py --non-interactive
      - name: Test backend
        shell: bash
        env:
          PYTHONUTF8: '1'
        run: |
          if [ -f .venv/Scripts/python.exe ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m pip check
          "$PY" -m unittest discover -s tests -v
      - name: Test aggiornamenti Android
        run: npm --prefix frontend test
      - name: Audit dipendenze frontend
        run: npm --prefix frontend audit --omit=dev --audit-level=high
      - name: Audit dipendenze Android
        run: npm --prefix mobile audit --omit=dev --audit-level=high
      - name: Audit dipendenze Python
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt --no-deps --disable-pip
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
